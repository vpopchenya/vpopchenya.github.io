<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>404: страница не найдена / Page not found</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0a2b">
<!-- Absolute paths on purpose: GitHub Pages serves this page for any missing address, at any depth. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <main data-testid="notfound" class="notfound">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес набран с ошибкой.</p>
    <p lang="en">This page does not exist. The address may be mistyped.</p>
    <p class="notfound-links">
      <a data-testid="notfound-home" class="btn" href="/">На главную</a>
      <a data-testid="notfound-en" class="btn" href="/en/" lang="en">English version</a>
    </p>
  </main>
</div>
</body>
</html>
